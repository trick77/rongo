<!-- iOS home-screen variant of tile.svg (apple-touch-icon.png).

     OPAQUE and edge to edge, unlike the master: iOS flattens any alpha onto
     black and then applies its own superellipse mask, so a rounded transparent
     tile comes back with a dark ring baked around it. The ground behind the
     chip is therefore ours to pick, and it is #1f1f1e, the index.css color-bg token.

     Square corners for the same reason — iOS rounds it, and rounding it twice
     leaves a visible double edge.

     The chip is inset rather than full-bleed so the superellipse crop has room:
     coverage 0.56, hence scale = 0.56 and translate = 32 * (1 - 0.56) = 14.08.

     Everything inside the group is a hand-mirrored copy of tile.svg. Change one,
     change all three. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="chip" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="46" y2="64">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <rect x="0" y="0" width="64" height="64" fill="#1f1f1e"/>
  <g transform="translate(14.08 14.08) scale(0.56)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#chip)"/>
    <g transform="translate(4 3) scale(0.56)" fill="none" stroke="#1f1f1e" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 12 H70" stroke-width="14"/>
      <path d="M50 12 V90" stroke-width="12"/>
      <path d="M15 36 H85" stroke-width="10"/>
      <path d="M9 32 V40" stroke-width="13"/>
      <path d="M91 32 V40" stroke-width="13"/>
      <path d="M50 54 C 34 57 17 67 11 89" stroke-width="11"/>
      <path d="M50 54 C 66 57 83 67 89 89" stroke-width="11"/>
    </g>
  </g>
</svg>
