name: Cleanup images

on:
  schedule:
    # Weekly, Sundays at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview deletions without removing anything"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: cleanup-images
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Keeps the most recent tagged versions per image and removes the rest,
      # including orphaned untagged versions. v3.1.0+ automatically protects
      # multi-arch / attestation child manifests of the kept images, so the
      # provenance manifests produced by the release build are never broken.
      # container-retention-policy panics rather than no-op'ing when the package
      # does not exist, and rongo has not cut its first release yet — so this
      # check is doing real work here, not just staying copy-pasteable.
      - id: package-check
        name: Check whether the rongo package exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #
        # Only a 404 means "not published yet". Treating every non-2xx as that
        # would turn a 403 on the packages endpoint into a workflow that skips
        # the retention step, stays green every week, and lets GHCR grow
        # unbounded with nobody looking — the worst shape a cleanup job can
        # fail in. Anything else fails the run.
        run: |
          status=$(gh api "users/${{ github.repository_owner }}/packages/container/rongo" \
            --silent -i 2>/dev/null | head -n1 | awk '{print $2}' || true)
          case "$status" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "No rongo container package yet — nothing to clean." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::error::Unexpected HTTP status '${status:-none}' from the packages API; refusing to treat this as an empty package."
              exit 1 ;;
          esac

      - if: steps.package-check.outputs.exists == 'true'
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "rongo"
          tag-selection: both
          keep-n-most-recent: 10
          # Protect anything pushed in the last hour so a fresh release is never
          # caught by a concurrently scheduled cleanup.
          cut-off: 1h
          dry-run: ${{ github.event.inputs.dry-run || 'false' }}
