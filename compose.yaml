# Production stack: one rongo service behind an external Traefik that terminates
# TLS, with Authelia as the OIDC provider. Requires the external "traefik"
# network the Traefik stack creates.
#
# First-run setup:
#
# 1. `./data` and `./repos` are gitignored and don't exist in a fresh clone.
#    Docker creates them root-owned on first `up`, but the container runs as
#    uid 1000 (see `user:` below) and fails with something like
#    "sqlite: unable to open database file". Create and own them first:
#
#      mkdir -p data repos && chown 1000:1000 data repos
#
# 2. Copy repos.example.yaml to conf/repos.yaml. It works unchanged — the one
#    active entry is rongo's own public remote — so add your repositories when
#    you have seen the first index run. It is mounted read-only; credentials
#    never belong in it (see the file). Without it rongo comes up and the
#    Repos page says what is missing.
#
#    An INVALID conf/repos.yaml is different: rongo refuses to start, and with
#    `restart: unless-stopped` below the container then restarts in a loop until
#    the file is fixed. That is deliberate. A file that fails to parse leaves the
#    PREVIOUS list in the database, so a server that came up anyway would serve a
#    complete, confident, arbitrarily stale corpus with nothing in the UI saying
#    the configuration was refused. `docker compose logs rongo` carries the parse
#    error with the offending line.
#
#      mkdir -p conf && cp repos.example.yaml conf/repos.yaml
#
# 3. Copy .env.example to .env and set at least:
#      BACKEND_SESSION_SECRET  at least 16 characters, not "change-me"
#                               (e.g. `openssl rand -base64 32`)
#      BACKEND_AUTH_MODE       "oidc" in production. "dev" refuses to start on
#                               the 0.0.0.0 address this file sets, since dev
#                               mode auto-logs in an admin with no credentials.
#      the BACKEND_OIDC_* block, whose client secret comes from
#      ../authelia/gen-clients.sh
#      LLMWIRE_MIMO_*          endpoint and key that answer questions
#      LLMWIRE_OPENAI_*        endpoint and key that build the index
#
#    The session secret is mandatory here: `up` stops with the message next to
#    it. A missing model key stops rongo at boot, naming the variable.
services:
  rongo:
    build:
      context: .
      dockerfile: backend/Containerfile
    image: ghcr.io/trick77/rongo:latest
    restart: unless-stopped
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    # rongo is PID 1 in here and reaps only the git it runs itself. git fetch
    # forks a detached helper (gc --auto, a session leader: the zombies showed
    # as "Zs") that is orphaned to PID 1 and exits later, so without an init
    # every fetch left one behind: 192 in 13 hours, until the container was
    # restarted. tini reaps them, and the read-only, cap-dropped setup is
    # untouched because docker-init is bind-mounted in from the host.
    init: true
    tmpfs:
      - /tmp
    # No host port: rongo answers questions about proprietary source, so the
    # only way in is the Traefik router below, which Authelia guards. Binding a
    # host port would put the app on a public interface with its own auth as
    # the only gate.
    environment:
      BACKEND_ADDR: 0.0.0.0:8080
      # git and ctags need a writable home and temp dir, and the root
      # filesystem is read-only. Without these, cloning fails with an error
      # about HOME rather than about permissions.
      HOME: /tmp
      TMPDIR: /tmp
      BACKEND_DB_PATH: /data/rongo.db
      BACKEND_REPO_ROOT: /repos
      BACKEND_REPOS_FILE: /conf/repos.yaml
      BACKEND_AUTH_MODE: ${BACKEND_AUTH_MODE:-oidc}
      BACKEND_ADMIN_TOKEN: ${BACKEND_ADMIN_TOKEN:-}
      # Password mode. The hash has three $ in it and compose expands $ in
      # .env: write each one as $$ there, or the container gets "$2a$10".
      BACKEND_ADMIN_USER: ${BACKEND_ADMIN_USER:-}
      BACKEND_ADMIN_PASSWORD_HASH: ${BACKEND_ADMIN_PASSWORD_HASH:-}
      BACKEND_COOKIE_SECURE: ${BACKEND_COOKIE_SECURE:-}
      BACKEND_SESSION_SECRET: ${BACKEND_SESSION_SECRET:?set it in .env, at least 16 characters, openssl rand -base64 32}
      # Authelia. The issuer carries no path and no trailing slash, or discovery
      # fails. The client secret comes from ../authelia/secrets/, generated by
      # that stack's gen-clients.sh. The redirect URL must be https://: it is
      # what the session cookie's Secure flag is derived from, because Traefik
      # terminates TLS and the process only ever sees plain HTTP.
      BACKEND_OIDC_ISSUER: ${BACKEND_OIDC_ISSUER:-}
      BACKEND_OIDC_CLIENT_ID: ${BACKEND_OIDC_CLIENT_ID:-}
      BACKEND_OIDC_CLIENT_SECRET: ${BACKEND_OIDC_CLIENT_SECRET:-}
      BACKEND_OIDC_REDIRECT_URL: ${BACKEND_OIDC_REDIRECT_URL:-}
      # Empty means no group check — every user Authelia's authorization_policy
      # let through is an admin. Set it only once a second tier exists here.
      BACKEND_OIDC_ADMIN_GROUP: ${BACKEND_OIDC_ADMIN_GROUP:-}
      # The provider keys, one per host llmwire's profiles name. Which ones
      # are needed follows from the models chosen below: MiMo and OpenAI by
      # default, and the process refuses to start naming the missing one,
      # rather than answering every question with 503. Every key is passed
      # through so choosing another model is a .env edit.
      LLMWIRE_MIMO_API_KEY: ${LLMWIRE_MIMO_API_KEY:-}
      LLMWIRE_OPENAI_API_KEY: ${LLMWIRE_OPENAI_API_KEY:-}
      LLMWIRE_ZAI_API_KEY: ${LLMWIRE_ZAI_API_KEY:-}
      # Read by llmwire itself, never by rongo: forwarded so it reaches it.
      LLMWIRE_EMULATE_OPENCODE: ${LLMWIRE_EMULATE_OPENCODE:-}
      # Which models answer, by llmwire profile id; empty is MiMo. And a
      # self-hosted gateway in front of them, llmwire's variables, passed
      # through so a deployment behind one is a .env edit; see .env.example.
      BACKEND_LLM_MODEL: ${BACKEND_LLM_MODEL:-}
      BACKEND_LLM_GATE_MODEL: ${BACKEND_LLM_GATE_MODEL:-}
      BACKEND_LLM_GATE_TEMPERATURE: ${BACKEND_LLM_GATE_TEMPERATURE:-}
      BACKEND_LLM_GATE_REASONING: ${BACKEND_LLM_GATE_REASONING:-}
      BACKEND_LLM_REASONING: ${BACKEND_LLM_REASONING:-}
      BACKEND_LLM_TIMEOUT: ${BACKEND_LLM_TIMEOUT:-}
      LLMWIRE_LITELLM_BASE_URL: ${LLMWIRE_LITELLM_BASE_URL:-}
      LLMWIRE_LITELLM_API_KEY: ${LLMWIRE_LITELLM_API_KEY:-}
      LLMWIRE_LITELLM_MODELS: ${LLMWIRE_LITELLM_MODELS:-}
      # Forge tokens for private repositories, named by token_env in repos.yaml.
      # Passed through even when unset so adding a private repo later is a
      # .env edit, not a compose edit.
      BACKEND_FORGE_TOKEN_GITHUB: ${BACKEND_FORGE_TOKEN_GITHUB:-}
      BACKEND_FORGE_TOKEN_BITBUCKET: ${BACKEND_FORGE_TOKEN_BITBUCKET:-}
      # An ssh remote's key and known_hosts, and a CA for a forge behind an
      # internal one. Passed through verbatim, so the values in .env are
      # paths INSIDE the container: ./git-auth is mounted at /git-auth below.
      BACKEND_GIT_SSH_KEY: ${BACKEND_GIT_SSH_KEY:-}
      BACKEND_GIT_SSH_KNOWN_HOSTS: ${BACKEND_GIT_SSH_KNOWN_HOSTS:-}
      BACKEND_GIT_CA_FILE: ${BACKEND_GIT_CA_FILE:-}
      # Repo-relative globs kept out of the index; see .env.example.
      BACKEND_INDEX_EXCLUDE: ${BACKEND_INDEX_EXCLUDE:-docs/plans/**}
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
    volumes:
      - ./data:/data
      - ./repos:/repos
      # The directory, not the file: a bind mount of a file that is missing on
      # the host makes Docker create a DIRECTORY at that path, and rongo then
      # reports "is a directory" forever. Mounting ./conf means a missing file
      # is simply a missing file. Read-only keeps rongo from ever rewriting
      # what an operator maintains by hand; the list carries no secrets.
      - ./conf:/conf:ro
      # Same shape for the same reason: the key, known_hosts and CA bundle
      # named by BACKEND_GIT_* live here, and a missing one is a missing file.
      # The key must be readable by uid 1000 and nobody else (chmod 600), or
      # ssh refuses it; known_hosts comes from
      # `ssh-keyscan -p 7999 bitbucket.example.com > git-auth/known_hosts`.
      - ./git-auth:/git-auth:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/rongo", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - traefik
    labels:
      # The single image serves both the API and the embedded SPA on :8080, so
      # it is the public service. No chain-authelia@file middleware: rongo is an
      # OIDC client and does its own login, like loom, music and peeq.
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.rongo.rule: Host(`rongo.trick77.com`)
      traefik.http.routers.rongo.entrypoints: websecure
      # No certresolver — ark's Traefik has no ACME provider and serves the
      # certificate dumped by mailcowdockerized-certdumper-1.
      traefik.http.routers.rongo.tls: "true"
      traefik.http.services.rongo.loadbalancer.server.port: "8080"

networks:
  # Created by the Traefik stack, not by this one.
  traefik:
    external: true
