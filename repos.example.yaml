# The repositories rongo indexes. Copy to repos.yaml.
#
# Credentials NEVER belong in this file — it ends up in a repository or a ticket
# sooner or later. Name the environment variable with token_env instead, and put
# the value in the environment.
#
# branch is optional. Omitting it means "the remote's default branch", resolved
# with `git ls-remote --symref origin HEAD`. That is not necessarily master:
# this corpus mixes master and main.
repositories:
  - name: peeq
    clone_url: /Users/jan/localgit/peeq
    # branch omitted on purpose: resolved from the remote

  # rongo indexes itself. It replaced loom on 2026-08-20: loom was peeq's
  # wholesale twin, rongo overlaps peeq only where it has to — retrieval,
  # storage, auth, scheduling — which is enough for a real ambiguous cohort
  # and gives the corpus a repository whose questions can be verified against
  # code that is right here.
  # Deliberately the remote, not the local checkout. Cloning a local path takes
  # that checkout's own branch ref, which lags whatever has been merged — the
  # first attempt indexed rongo at 4 files because the local master was months
  # behind origin/master. A local clone_url indexes the working copy's opinion,
  # not the published code.
  - name: rongo
    clone_url: https://github.com/trick77/rongo.git

  # A dependency peeq genuinely declares in go.mod, so cross-repo composition is
  # exercised against real data rather than a fixture.
  - name: go-sqlite3
    clone_url: https://github.com/ncruces/go-sqlite3.git

  # Deliberately NOT listed, so the "the boundary is named" invariant is
  # exercised in daily use and not only in tests:
  #   asg017/sqlite-vec

  # An entry kept for the record but not indexed:
