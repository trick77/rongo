# The projects rongo indexes, and the repositories each is built from. Copy to
# conf/repos.yaml.
#
# As shipped this file works unchanged: rongo is public, so the one active
# entry needs no token and indexes on the first start. Add your own below.
#
# A PROJECT is the unit rongo searches and the unit a reader is asked to choose
# between, because a product often lives in several repositories - a backend, a
# UI, a queue consumer - and asking which of those was meant makes someone pick
# half an answer. A repository that stands alone is a project of one, named
# after itself. The project holds its repositories, so the grouping is written
# once and a repository cannot end up in two products.
#
# Credentials NEVER belong in this file — it ends up in a repository or a ticket
# sooner or later. Name the environment variable with token_env instead, and put
# the value in the environment.
#
# branch is optional. Omitting it means "the remote's default branch", resolved
# with `git ls-remote --symref origin HEAD`. That is not necessarily master:
# this corpus mixes master and main.
#
# snapshot: true is for source that arrives as an ARCHIVE rather than a remote —
# a vendor drop, a released tarball, anything with no git repository behind it.
# There is nothing to clone, so clone_url, branch and token_env are all refused
# on such an entry. Instead you extract the archive into the repository root
# yourself, and rongo commits what it finds there once so every citation still
# carries a real sha. See the acme-core block below for what that involves.
#
# Use it only when there is genuinely no remote. Where one exists it is always
# the better source — see the rongo entry, which is deliberately the remote.
#
# part, description and uses are optional, and they matter as soon as a project
# holds more than one repository: with two backends, "part: backend" is true of
# both and only the declared edge says which one the storefront calls. All three
# are written by hand here and never inferred - a manifest cannot see across a
# Go backend and a TypeScript UI, and guessing from names is not a fact.
projects:
  # rongo indexes itself. It replaced loom on 2026-08-20: loom was peeq's
  # wholesale twin, rongo overlaps peeq only where it has to — retrieval,
  # storage, auth, scheduling — which is enough for a real ambiguous cohort
  # and gives the corpus a repository whose questions can be verified against
  # code that is right here.
  - name: rongo
    repositories:
      # Deliberately the remote, not a local checkout. Cloning a local path
      # takes that checkout's own branch ref, which lags whatever has been
      # merged — the first attempt indexed rongo at 4 files because the local
      # master was months behind origin/master. A local clone_url indexes the
      # working copy's opinion, not the published code. It also does not exist
      # inside the container.
      - name: rongo
        clone_url: https://github.com/trick77/rongo.git
        # branch omitted on purpose: resolved from the remote

  # A source archive with no remote behind it at all. rongo does not clone this:
  # you extract it yourself into BACKEND_REPO_ROOT/acme-core — ./repos/acme-core
  # in the compose stack — and rongo makes one commit out of what is there, on a
  # branch called "snapshot", which is what its citations then carry.
  #
  # Three things go wrong if they are skipped:
  #   - Unpack the archive's own top-level folder AWAY. The manifest has to land
  #     at repos/acme-core/go.mod, not repos/acme-core/acme-core-4.2/go.mod, or
  #     nothing reads it as a project.
  #   - The directory must be writable by the container's uid (1000), because
  #     `git init` creates .git inside it.
  #   - To refresh, DELETE the directory and extract the new archive. Extracting
  #     over the old one leaves files the new release dropped sitting in both the
  #     tree and the index. Either way rongo works out what changed by itself.
  #
  # It is never fetched and never polled for changes, so it costs nothing until
  # it is extracted again. That is the point of indexing one.
  #- name: acme-core
  #  repositories:
  #    - name: acme-core
  #      snapshot: true
  #      part: backend
  #      description: Vendor drop, release 4.2. Source archive, no remote.

  # A dependency peeq genuinely declares in go.mod, so cross-repo composition is
  # exercised against real data rather than a fixture. Coupling ACROSS projects
  # is read from the manifest and never declared here; uses is for siblings.
  #- name: go-sqlite3
  #  repositories:
  #    - name: go-sqlite3
  #      clone_url: https://github.com/ncruces/go-sqlite3.git

  # A private repository: the token lives in the environment under the name
  # given here, never in this file.
  #- name: peeq
  #  repositories:
  #    - name: peeq
  #      clone_url: https://github.com/trick77/peeq.git
  #      token_env: BACKEND_FORGE_TOKEN_GITHUB

  # Deliberately NOT listed, so the "the boundary is named" invariant is
  # exercised in daily use and not only in tests:
  #   asg017/sqlite-vec

  # A project kept for the record but not indexed. enabled sits on BOTH levels:
  # on the project it parks the whole product in one edit, on a repository it
  # parks one member, because parking one half of a product is normal. A
  # project's false wins over a member's true — a parked product is parked
  # whole, and one member opting back in would keep a product alive that the
  # page no longer shows.
  #
  # Parking is not removing. The index and the checkout stay, and the entry is
  # simply switched off: not polled, not searched, not offered when rongo asks
  # which product you meant, and off the Repos page, which says in one line how
  # many entries it is not showing. Citations already written keep working —
  # parking stops new answers, it does not revise old ones. DELETING the entry
  # is what purges it.
  #- name: legacy-crm
  #  enabled: false
  #  repositories:
  #    - name: legacy-crm
  #      clone_url: https://forge.example.invalid/acme/legacy-crm.git
  #      token_env: BACKEND_FORGE_TOKEN
  #      enabled: false

  # One product in six repositories, using every feature at once. Read the uses
  # edges as arrows: the storefront calls two services, both of which are built
  # against one contract, so the contract is reached by two paths and drawn once
  # on the Projects page. Nothing declares an edge to the admin API or the queue
  # consumer — that absence is a fact, not an oversight, and it is what keeps an
  # answer about the storefront from attributing a call to the wrong backend.
  #
  #   shop-ui ─┬─> shop-backend ─┬─> shop-contract
  #            └─> shop-search ──┘
  #   shop-admin-backend, shop-events: reached from outside the project
