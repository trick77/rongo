<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rongo + Almanach — integration mock</title>
<style>
  @font-face { font-family: "Anthropic Sans"; src: url("../../ui/src/fonts/SansWebVariable-TextRegular.woff2") format("woff2"); font-weight: 300 800; font-display: swap; }
  @font-face { font-family: "Anthropic Serif"; src: url("../../ui/src/fonts/SerifWebVariable-TextRegular.woff2") format("woff2"); font-weight: 300 800; font-display: swap; }
  @font-face { font-family: "Anthropic Serif"; src: url("../../ui/src/fonts/SerifWebVariable-TextRegularItalic.woff2") format("woff2"); font-weight: 300 800; font-style: italic; font-display: swap; }
  @font-face { font-family: "Anthropic Mono"; src: url("../../ui/src/fonts/MonoVariableVariable-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }

  :root {
    /* peeq / loom / rongo / almanach tokens, verbatim */
    --bg: #1f1f1e; --panel: #1b1b1a; --active: #2c2c2a; --border: #323230; --border-soft: #2a2a28;
    --ink: #faf9f5; --ink-dim: #e4e1d8; --ink-prose: #f3f0e8; --muted: #9c9a92; --faint: #6f6d66;
    --accent: #c6613f; --accent-strong: #d97757; --accent-fill: #c25f34; --accent-dim: #5a3527;
    --online: #5aa06a; --danger: #c14638; --danger-ink: #ec7e7e; --kept: #d6a15a;
    --elevated: #363632; --elevated-border: #454540;
    --shadow-panel: 0 24px 60px -18px rgba(0,0,0,.6);
    --sans: "Anthropic Sans", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: "Anthropic Serif", Georgia, "Times New Roman", serif;
    --mono: "Anthropic Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --r: 10px; --r-sm: 8px; --r-lg: 12px;
    --rail: 248px; --evw: 320px; --crail: 196px;
    /* ochre = "your move" */
    --wait: var(--kept); --wait-wash: rgba(214,161,90,.14);
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body { background: #141413; color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  code, .mono { font-family: var(--mono); font-size: .9em; }
  [hidden] { display: none !important; }
  template { display: none; }

  /* ================= mockbar + stage ================= */
  .mockbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; height: 44px; display: flex; gap: 18px; align-items: center; padding: 0 18px; background: #0f0f0e; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .mockbar .grp { display: inline-flex; gap: 2px; border: 1px solid var(--border); border-radius: 999px; padding: 2px; background: var(--panel); flex: none; }
  .mockbar .grp button { padding: 4px 12px; border-radius: 999px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .mockbar .hint { white-space: normal; line-height: 1.25; font-size: 11.5px; min-width: 0; }
  .mockbar .grp button[aria-pressed="true"] { background: var(--accent-fill); color: var(--ink); }
  .mockbar .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-right: 6px; }
  .mockbar .hint { margin-left: auto; color: var(--faint); }
  #stage { padding-bottom: 48px; }
  #stage[data-mode="compare"] { padding: 24px 24px 72px; display: grid; gap: 28px; }
  .frame { border: 1px solid var(--elevated-border); border-radius: 12px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow-panel); }
  .frame .ftitle { padding: 8px 14px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); background: #0f0f0e; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
  .frame .ftitle b { color: var(--kept); font-weight: 500; }
  .frame .app { height: 880px; }
  #stage:not([data-mode="compare"]) .frame { border: 0; border-radius: 0; box-shadow: none; }
  #stage:not([data-mode="compare"]) .frame .ftitle { display: none; }
  #stage:not([data-mode="compare"]) .frame .app { height: calc(100vh - 44px); }

  /* ================= app shell ================= */
  .app { display: grid; grid-template-rows: 56px 1fr; background: var(--bg); color: var(--ink); min-height: 0; }
  .bar { display: grid; grid-template-columns: var(--rail) 1fr auto; align-items: center; border-bottom: 1px solid var(--border); background: var(--panel); }
  .app[data-shell="b"] .bar { grid-template-columns: auto 1fr auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 20px; font-family: var(--serif); font-weight: 500; font-size: 21px; letter-spacing: -.01em; height: 100%; color: #f4f0e8; white-space: nowrap; }
  .brand small { font-family: var(--mono); color: var(--faint); font-weight: 400; font-size: 11px; margin-left: auto; }
  .app[data-shell="b"] .brand small { margin-left: 6px; }
  .crumb { display: flex; align-items: center; gap: 10px; padding: 0 24px; font-size: 15px; color: var(--muted); min-width: 0; }
  .crumb b { color: var(--accent-strong); font-weight: 500; font-family: var(--serif); font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb .sep { color: var(--faint); }
  .app[data-shell="b"] .crumb { display: none; }
  .topnav { display: none; align-items: center; gap: 2px; padding: 0 8px; }
  .app[data-shell="b"] .topnav { display: flex; }
  .topnav button { padding: 6px 12px; border-radius: var(--r-sm); color: var(--muted); font-size: 14px; }
  .topnav button:hover { color: var(--ink); background: var(--active); }
  .topnav button[aria-current="page"] { color: var(--ink); background: var(--active); }
  .topnav .cnt, .nav .cnt { margin-left: 6px; border-radius: 999px; background: var(--accent-dim); color: var(--ink); font-size: 11.5px; padding: 0 6px; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; background: var(--panel); line-height: 1.5; }
  .pill.accent { border-color: var(--accent-dim); background: var(--accent-dim); color: var(--accent-strong); font-weight: 500; }
  .pill.ochre { border-color: transparent; background: var(--wait-wash); color: var(--wait); font-weight: 500; }
  .pill.dim { border-color: transparent; background: var(--active); color: var(--muted); }
  .pill.ok { border-color: transparent; background: rgba(90,160,106,.16); color: var(--online); font-weight: 500; }
  .pill.fail { border-color: transparent; background: rgba(193,70,56,.16); color: var(--danger-ink); font-weight: 500; }
  .pill.quiet { border-color: var(--border); background: transparent; color: var(--faint); }
  .pill.kind { border-color: transparent; background: var(--active); color: var(--ink-dim); font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em; }
  .pill i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
  .user { display: flex; align-items: center; gap: 14px; padding: 0 20px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .user button:hover { color: var(--ink); }

  .body { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 0; }
  .app[data-shell="b"]:not([data-page="ask"]) .body { grid-template-columns: 1fr; }
  .app[data-shell="b"]:not([data-page="ask"]) .rail { display: none; }
  .rail { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .nav { padding: 12px 12px 4px; display: grid; gap: 2px; }
  .app[data-shell="b"] .nav, .app[data-shell="b"] .lbl.explore { display: none; }
  .nav button { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--r-sm); color: var(--muted); font-size: 15px; text-align: left; position: relative; }
  .nav button:hover { color: var(--ink); background: var(--active); }
  .nav button[aria-current="page"] { color: var(--ink); background: var(--active); }
  .nav button[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .lbl { padding: 14px 24px 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); display: flex; font-weight: 500; }
  .lbl .n { margin-left: auto; letter-spacing: 0; font-family: var(--mono); }
  .threads { flex: 1; overflow: auto; padding: 0 12px 12px; }
  .threads button { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; padding: 7px 12px; border-radius: var(--r-sm); color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; }
  .threads button > .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .threads button > time { margin-left: auto; flex: none; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .threads button:hover, .threads button[aria-current="true"] { color: var(--ink); background: var(--active); }
  .threads .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-strong); animation: pulse 1.2s ease-in-out infinite; flex: none; align-self: center; }
  .threadwrap { display: contents; }
  .app:not([data-page="ask"]) .threadwrap { display: none; }
  .app[data-page="ask"] .crail-slot { display: none; }
  .crail-slot { flex: 1; overflow: auto; padding: 4px 12px 12px; }
  .railfoot { margin: 0 12px 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg); font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
  .railfoot div { display: flex; gap: 8px; align-items: center; }
  .railfoot i { width: 7px; height: 7px; border-radius: 50%; background: var(--online); flex: none; }
  .railfoot i.wait { background: var(--wait); }

  /* content rail (Almanach's Inhalt), shared markup in both shells */
  .crail { font-size: 13.5px; }
  .crail .search { position: relative; margin: 10px 0 6px; }
  .crail .search input { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--panel); color: var(--ink); padding: 0 32px 0 10px; font: inherit; font-size: 13.5px; }
  .crail .search kbd { position: absolute; right: 8px; top: 8px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .crail .grp { padding: 10px 0 2px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
  .crail a { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; }
  .crail a:hover { color: var(--ink); }
  .crail a[aria-current="true"] { color: var(--ink); border-left-color: var(--accent); }
  .crail a .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .crail .head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 4px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .crail .head b { color: var(--ink); font-weight: 500; }
  .crail .head .nav2 { margin-left: auto; font-family: var(--mono); color: var(--faint); letter-spacing: .1em; }

  /* ================= main / pages ================= */
  main { min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
  section[data-view] { display: contents; }
  .scroll { flex: 1; overflow: auto; min-height: 0; }
  .page { padding: 28px 40px 60px; max-width: 1180px; }
  .app[data-shell="b"]:not([data-page="ask"]) .page { display: grid; grid-template-columns: var(--crail) minmax(0,1fr); gap: 0 44px; max-width: 1400px; margin: 0 auto; }
  .crail-b { display: none; }
  .app[data-shell="b"]:not([data-page="ask"]) .crail-b { display: block; position: sticky; top: 0; align-self: start; padding-top: 44px; }
  .app[data-shell="b"] .page > .col { min-width: 0; }
  .page h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 28px; font-weight: 500; letter-spacing: -.01em; }
  .page .lede { color: var(--muted); margin: 0 0 22px; font-size: 14.5px; max-width: 70ch; }
  .crumbs { font-size: 13px; color: var(--faint); margin: 0 0 10px; display: flex; gap: 8px; }
  .crumbs a { color: var(--muted); text-decoration: none; }
  .crumbs a:hover { color: var(--ink); }
  .head { display: flex; align-items: flex-start; gap: 20px; }
  .head .grow { flex: 1; min-width: 0; }
  .metaline { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13.5px; color: var(--muted); margin: 4px 0 0; }
  .metaline .sep { color: var(--faint); }
  .metaline .ix { color: var(--ink-dim); }
  .acts { display: flex; gap: 8px; align-items: center; flex: none; }
  .btn { font-size: 13.5px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 999px; color: var(--ink-dim); background: var(--panel); white-space: nowrap; }
  .btn:hover { background: var(--active); border-color: var(--elevated-border); }
  .btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--ink); }
  .btn.primary:hover { background: var(--accent-strong); }
  .btn.small { font-size: 12.5px; padding: 4px 10px; }
  .btn.danger { color: var(--danger-ink); }
  .btn kbd { font-family: var(--mono); color: var(--faint); margin-left: 6px; font-size: 11px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 18px 0 22px; }
  .tabs button { padding: 7px 12px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs button .n { color: var(--faint); font-family: var(--mono); font-size: 11.5px; margin-left: 6px; }
  .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
  h3.sec { margin: 30px 0 10px; font-family: var(--serif); font-size: 21px; font-weight: 500; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; }
  h3.sec small { font-family: var(--sans); font-size: 12.5px; color: var(--faint); font-weight: 400; }
  h3.sec .push { margin-left: auto; display: flex; gap: 6px; }
  .icobtn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); background: var(--panel); }
  .icobtn svg { width: 14px; height: 14px; }

  .strip { display: flex; border: 1px solid var(--border); border-radius: var(--r); background: var(--panel); margin: 18px 0 8px; overflow: hidden; }
  .strip div { padding: 12px 18px; border-right: 1px solid var(--border); flex: 1; white-space: nowrap; }
  .strip div:last-child { border-right: 0; }
  .strip .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
  .strip .v { font-family: var(--serif); font-size: 24px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .strip .v small { font-family: var(--sans); font-size: 12.5px; color: var(--muted); margin-left: 6px; }
  .strip div.rongo .k::after, .tile.rongo .k::after { content: "rongo"; margin-left: 6px; font-family: var(--mono); letter-spacing: 0; text-transform: none; color: var(--accent-strong); }

  table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; border: 1px solid var(--border); border-radius: var(--r); background: var(--panel); overflow: hidden; }
  table.tbl th { text-align: left; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 500; padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--bg); white-space: nowrap; }
  table.tbl th.rongo::after { content: "rongo"; margin-left: 6px; font-family: var(--mono); letter-spacing: 0; text-transform: none; color: var(--accent-strong); }
  table.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  table.tbl tr:last-child td { border-bottom: 0; }
  table.tbl tr.row:hover td { background: var(--active); cursor: pointer; }
  table.tbl .num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .name { font-family: var(--mono); font-weight: 500; font-size: 13px; }
  .sub { color: var(--faint); font-size: 12px; margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .teaser { color: var(--muted); font-size: 13px; max-width: 42ch; line-height: 1.45; }
  .sha { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .when { color: var(--faint); font-size: 12px; margin-left: 6px; }
  .errline { margin-top: 4px; color: var(--accent-strong); font-size: 12.5px; }
  tr[data-state="error"] td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
  tr[data-state="off"] td { color: var(--faint); }
  .stack { display: grid; gap: 4px; }
  .stack .btn { text-align: center; }

  /* callouts: open decisions */
  .callout { margin: 26px 0 0; border: 1px solid var(--border); border-left: 3px solid var(--wait); border-radius: 8px; background: var(--panel); padding: 12px 16px; font-size: 13px; color: var(--ink-dim); max-width: 78ch; line-height: 1.5; }
  .callout b { color: var(--ink); font-weight: 600; }
  .callout .tag { display: inline-block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--wait); font-weight: 600; margin-right: 8px; }
  .callout p { margin: 4px 0 0; }

  /* ================= ask ================= */
  .ask { display: grid; grid-template-columns: 1fr var(--evw); min-height: 0; flex: 1; }
  .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .thread { padding: 32px 40px 40px; max-width: 900px; }
  .turn { padding: 0 0 32px; margin-bottom: 32px; border-bottom: 1px solid var(--border-soft); }
  .turn:last-of-type { border-bottom: 0; }
  .q { margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; color: var(--ink); max-width: 30ch; text-wrap: balance; }
  .eyebrow.role { color: var(--accent-strong); margin-bottom: 6px; }
  .meta { display: flex; gap: 6px; align-items: center; margin: 10px 0 0 0; }
  .meta time { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  .chev { width: 11px; height: 11px; transition: transform .15s; flex: none; }
  [aria-expanded="true"] > .chev { transform: rotate(90deg); }
  .prog { margin: 16px 0 0 0; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 22px 1fr auto; column-gap: 12px; font-size: 14px; color: var(--muted); position: relative; }
  .steps::before { content: ""; position: absolute; left: 10px; top: 14px; bottom: 14px; width: 1px; background: var(--border); }
  .steps li { display: contents; }
  .steps li > i { position: relative; width: 22px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .steps li > i::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--bg); }
  .steps li > span { line-height: 28px; }
  .steps li > span .wiki { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 8px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .steps li > time { line-height: 28px; font-family: var(--mono); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
  .steps li.done > i::before { background: var(--online); }
  .steps li.end > span { color: var(--ink); font-weight: 500; }
  .steps li.end > i::before { width: 12px; height: 12px; }
  .steps li.wait > i::before { background: var(--wait); box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--wait-wash); }
  .steps li.wait > span { color: var(--wait); }
  .steps li.decided > i::before { background: var(--muted); }
  .steps li.decided > span { color: var(--muted); font-weight: 400; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-dim); } }
  @media (prefers-reduced-motion: reduce) { .threads .pulse, .caret { animation: none; } }

  .clar { margin: 12px 0 0 0; border: 1px solid var(--border); border-radius: var(--r); background: var(--panel); }
  .clar.open { border-color: var(--wait); }
  .clar > button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; font-size: 14.5px; }
  .clar.open > button { color: var(--wait); font-weight: 500; }
  .clar .lab { font-size: 11px; color: var(--faint); letter-spacing: .1em; text-transform: uppercase; font-weight: 500; }
  .clar .sub2 { margin-left: auto; font-size: 12.5px; color: var(--faint); }
  .cands { border-top: 1px solid var(--border-soft); }
  .cand { display: grid; gap: 3px; width: 100%; text-align: left; padding: 12px 16px 12px 14px; border-left: 3px solid var(--accent-dim); border-bottom: 1px solid var(--border-soft); }
  .cand:last-child { border-bottom: 0; }
  .cand:hover { background: var(--active); }
  .cand .l1 { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .cand .l1 .proj { font-family: var(--mono); color: var(--wait); font-weight: 500; }
  .cand .l1 .reps { color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
  .cand .l1 .hair { flex: 1; height: 1px; background: var(--border-soft); }

                <div class="ans">
                  <p>It no longer can. Cancelling an order reads its state and sets it to cancelled in the same database transaction<sup><a href="#b1">1</a></sup>. A second cancel request finds the order already cancelled and is answered with a conflict, not a success<sup><a href="#b2">2</a></sup>; nothing downstream runs twice.</p>
                  <p>This used to be possible. Before pull request 412 the state was read first and written later, and two requests arriving within the same second both passed the check. Each of them then triggered a refund, which is how the double credit notes in billing came about<sup><a href="#b3">3</a></sup>. The wiki records the fix as an invariant of the order component<sup><a href="#b4" class="wiki">4</a></sup>; the code that enforces it is the state check inside the cancel transaction<sup><a href="#b1">1</a></sup>.</p>
                  <p>What still happens on the second request is a log line and the conflict response. The customer-facing storefront treats that conflict as "already cancelled" and shows the order in its cancelled state.</p>

          <h3 class="sec">Überblick</h3>
          <div class="prose">
            <p>shop-backend ist die Storefront-API des Shops: es nimmt Bestellungen aus dem Warenkorb entgegen, reserviert den Bestand, übergibt die Zahlung an den Zahlungsdienst und schreibt jede Zustandsänderung als Ereignis nach Kafka. Was ausserhalb liegt: die Rechnung (billing) und die Auslieferung (ERP) lesen die Ereignisse, das Backend ruft sie nie.</p>
            <h4>Aufbau</h4>
            <p>Vier Teile unter <code>internal/</code>: <code>order</code> hält Bestellung und Zustand, <code>stock</code> die Reservierung, <code>checkout</code> den Weg vom Warenkorb zur Bestellung, <code>payment</code> die Hülle um payments-client. Der HTTP-Router liegt in <code>cmd/api</code>, der Vertrag in <code>openapi.yaml</code>.</p>
            <h4>Arbeiten am Repository</h4>
            <p>Gate ist <code>make check</code>; kein Test spricht den Zahlungsdienst an, <code>httptest</code> ersetzt ihn. Eine neue Route: Handler, openapi.yaml, Test, in dieser Reihenfolge.</p>
          </div>

          <h3 class="sec">Bestellung und Checkout<small>4 statements</small></h3>

            <h4>Eine Bestellung wird höchstens einmal storniert</h4>
            <button class="btn small ask">Ask about this</button>
            <div class="prose"><p>Der Stornoendpunkt prüft den Zustand der Bestellung in derselben Transaktion, in der er ihn setzt. Ein zweiter Aufruf findet den Zustand <code>cancelled</code> vor und antwortet 409, nie 200: die Rückerstattung liefe sonst zweimal. Vor #412 lag zwischen Prüfung und Schreiben ein zweiter Aufruf, und beide lösten eine Rückerstattung aus.</p></div>
            <div class="foot"><span class="f">internal/order/cancel.go</span><span class="f">internal/order/state.go</span><span class="sep">|</span><a class="prchip" href="#">SHOP/shop-backend#412</a><span class="prchip quiet">Geprüft a3f1c02</span></div>

<!-- ================= stage ================= -->
<div id="stage" data-mode="a"></div>

<div class="mockbar">
  <span class="lbl">Shell</span>
  <div class="grp" data-shells><button data-shell="a" aria-pressed="true">A · Rongo hosts</button><button data-shell="b">B · Almanach hosts</button><button data-shell="compare">Compare</button></div>
  <span class="lbl" style="margin-left:10px">Page</span>
  <div class="grp" data-pages><button data-page="ask" aria-pressed="true">Ask</button><button data-page="project">Project</button><button data-page="repo">Repository</button><button data-page="sources">Sources</button><button data-page="queue">Queue</button><button data-page="deps">Dependencies</button></div>
  <span class="hint" data-hint></span>
</div>

<script>
  const tpl = document.getElementById('app-tpl');
  const stage = document.getElementById('stage');
  let shell = 'a', page = 'ask';
  const hints = {
    a: 'A: Rongo’s rail hosts everything; on wiki pages it turns into the content rail. Cost: the wiki reads as a section of a chat app.',
    b: 'B: Almanach’s top nav hosts everything; the thread rail exists only under Ask. Cost: Ask one click deeper, the rail flips in and out.',
    compare: 'Same page, both shells, A above B. Scroll inside each frame.'
  };

  function build(sh) {
    const app = tpl.content.firstElementChild.cloneNode(true);
    app.dataset.shell = sh; app.dataset.page = page;
    const sec = app.querySelector(`section[data-view="${page}"]`);
    // current page markers
    app.querySelectorAll('[data-go]').forEach(b => { const cur = b.dataset.go === (page === 'repo' ? 'project' : page); if (cur) b.setAttribute('aria-current', 'page'); });
    app.querySelectorAll('section[data-view]').forEach(s => s.hidden = s !== sec);
    // crumb (shell A)
    const crumb = app.querySelector('[data-crumb]');
    const pre = sec.dataset.crumb;
    crumb.innerHTML = (pre ? pre.split(' / ').map(p => `<span>${p}</span><span class="sep">/</span>`).join('') : '') + `<b>${sec.dataset.title}</b>` + (page === 'ask' ? '<span class="pill accent">Analyst</span><span class="pill dim">3 turns</span><span class="pill dim">shop</span>' : '');
    // content rail: template inside the section → rail slot (A) or crail-b (B)
    const ct = sec.querySelector('template.crail');
    if (ct) {
      const node = ct.content.firstElementChild.cloneNode(true);
      if (sh === 'a') app.querySelector('.crail-slot').appendChild(node); else sec.querySelector('.crail-b').appendChild(node);
    }
    wire(app);
    const frame = document.createElement('div'); frame.className = 'frame';
    frame.innerHTML = `<div class="ftitle">Shell <b>${sh.toUpperCase()}</b> · ${sh === 'a' ? 'Rongo hosts' : 'Almanach hosts'} · ${sec.dataset.title}</div>`;
    frame.appendChild(app);
    return frame;
  }

  function render() {
    stage.dataset.mode = shell;
    stage.innerHTML = '';
    if (shell === 'compare') { stage.appendChild(build('a')); stage.appendChild(build('b')); }
    else stage.appendChild(build(shell));
    document.querySelector('[data-hint]').textContent = hints[shell];
    document.querySelectorAll('[data-shells] button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.shell === shell)));
    document.querySelectorAll('[data-pages] button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.page === page)));
  }

  function wire(app) {
    app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { page = b.dataset.go; render(); }));
    app.querySelectorAll('.clar > button').forEach(b => b.addEventListener('click', () => {
      const open = b.getAttribute('aria-expanded') === 'true';
      b.setAttribute('aria-expanded', String(!open));
      const list = b.nextElementSibling; if (list) list.hidden = open;
    }));
    // compact map: light connections of the box pointed at
    app.querySelectorAll('.map').forEach(map => {
      const conn = map.querySelector('[data-conn]');
      const byId = id => map.querySelector(`[data-id="${id}"]`);
      const names = { gw: 'API-Gateway', pg: 'PostgreSQL shop', kafka: 'Kafka orders.*', psp: 'Zahlungsdienst (PSP)', 'payments-client': 'payments-client', 'shop-backend': 'shop-backend', 'pdf-kit': 'pdf-kit' };
      const ways = { out: '→', in: '←', both: '↔' };
      map.querySelectorAll('.box[data-to]').forEach(box => {
        const light = on => {
          map.querySelectorAll('.lit, .focus').forEach(x => x.classList.remove('lit', 'focus'));
          if (!on) { map.classList.remove('dim'); return; }
          map.classList.add('dim'); box.classList.add('focus');
          const parts = [];
          box.dataset.to.split(',').forEach(e => { const [id, way, kind] = e.split(':'); const t = byId(id); if (t) t.classList.add('lit'); parts.push(`<b>${names[id] || id}</b><span class="w">${ways[way]}</span>${kind}`); });
          if (conn) conn.innerHTML = `${box.querySelector('.nn').textContent}: connected with ` + parts.join(', ');
        };
        box.addEventListener('mouseenter', () => light(true));
        box.addEventListener('focus', () => light(true));
        box.addEventListener('mouseleave', () => light(false));
      });
    });
    // the project map starts with shop-backend lit (as the static text says)
    const first = app.querySelector('[data-map] .box.focus');
    if (first) { first.dispatchEvent(new Event('mouseenter')); }
  }

  document.querySelectorAll('[data-shells] button').forEach(b => b.addEventListener('click', () => { shell = b.dataset.shell; render(); }));
  document.querySelectorAll('[data-pages] button').forEach(b => b.addEventListener('click', () => { page = b.dataset.page; render(); }));
  render();
</script>
